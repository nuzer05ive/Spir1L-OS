name: spir1l-ci
on: [push, pull_request]
jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
- run: echo "About to install"
- run: pnpm i
- run: echo "Install complete"
- run: pnpm -r build
- run: echo "Build complete"
- run: pnpm -r test
- run: echo "Test complete"
  auditor:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node packages/auditor/dist/drift-auditor.js
